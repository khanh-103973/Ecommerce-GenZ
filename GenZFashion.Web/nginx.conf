server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Resolve the API at request time on a Docker user-defined network.
    # The API container will need the network alias "api" in the run step.
    resolver 127.0.0.11 valid=10s;

    location ~ ^/api(?:/|$) {
        set $api_backend http://api:8080;
        proxy_pass $api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace client-supplied forwarded values at this single-proxy boundary.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # React Router routes must work when opened directly or refreshed.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
